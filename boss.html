  .hintBtn { border: 1px dashed #ffd24d; color: #ffd24d; background: rgba(255,210,77,.06);

  .hinttext { display: none; border-left: 3px solid #ffd24d; background: rgba(255,210,77,.07);

  .q .tag { display: inline-block; font-size: 12px; color: #d8b4fe; background: #3b2455; border-radius: 999px; padding: 1px 10px; margin-bottom: 8px; }
  .q .qtext { font-size: 15px; white-space: pre-wrap; margin-bottom: 12px; }
  .choice { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
    background: none; border: 1px solid #4a2a5a; border-radius: 10px;

  .choice .mark { font-weight: 700; color: #b09090; flex-shrink: 0; }

  .choice.correct { border-color: #4ade80; background: #14331f; }
  .choice.wrong { border-color: #f87171; background: #3b1a1a; }
  .goldra {
    display: flex; gap: 8px; align-items: center; justify-content: center; width: 100%;
    background: linear-gradient(180deg, #6b4a10, #3a2708); border: 2px solid #ffe9a8;
    color: #fff8e0; border-radius: 8px; padding: 10px 12px; margin-top: 10px;
    font-size: 13.5px; font-family: inherit; cursor: pointer; font-weight: 700;
  }

    box-shadow: 0 0 0 2px #a8801e, 0 0 16px rgba(255,210,77,.6);
  }

  }
  #dragon.fly { display: block; animation: dragonfly 1.5s ease-in-out forwards; }
  @keyframes dragonfly {
    0% { left: -30vw; transform: scale(.7) rotate(-8deg); opacity: 0; }
    15% { opacity: 1; }
    50% { transform: scale(1.15) rotate(4deg); }
    85% { opacity: 1; }
    100% { left: 110vw; transform: scale(.7) rotate(-6deg); opacity: 0; }
  }
  #confirm {
    position: fixed; inset: 0; z-index: 600; display: none;

  }
  #confirm.show { display: flex; }

    box-shadow: 0 0 0 3px #a8801e, 0 10px 30px rgba(0,0,0,.7);

  .opt.wrong { border-color: #f87171; background: #3b1a1a; color: #f87171; }

  #jobwin {
    width: 100%; max-width: 560px; max-height: 55vh; overflow-y: auto;
    background: linear-gradient(180deg, #2038c8 0%, #0c1878 100%);
    border: 3px solid #fff; border-radius: 8px;
    box-shadow: 0 0 0 3px #3858e8, 0 6px 24px rgba(0,0,0,.7);

  #jobNo { background: none; border: 2px solid #8890d8; color: #cdd6ff; }
  .backlink { display: block; text-align: center; color: #9fd0ff; font-size: 13px; margin: 10px 0; text-decoration: none; }
</style>

      typing = false; arrowEl.style.display = 'inline'; advanceCb = cb;
    }
  })();
}
document.getElementById('msgwin').addEventListener('click', () => {
  if (typing) { skipReq = true; return; }
  if (advanceCb) { const cb = advanceCb; advanceCb = null; sfxBlip(); cb(); }
});
// シーン再生: scenes = [{emoji?, name?, text, before?()}]
function playScenes(scenes, done) {
  let idx = 0;
  (function next() {
    if (idx >= scenes.length) { if (done) done(); return; }
    const s = scenes[idx++];
    if (s.emoji !== undefined) stageEmoji.textContent = s.emoji;
    if (s.name !== undefined) stageName.textContent = s.name;
    if (s.cls !== undefined) stageEmoji.className = s.cls;
    if (s.before) s.before();
    setTimeout(() => typeLine(s.text, next), s.wait || 0);
  })();
}

// ---- ボスバナー・問題描画 ----
document.getElementById('bossBanner').innerHTML =
  (B.boss.art ? `<img class="bimg" src="${B.boss.art}" alt="">` : `<span class="bemoji">${B.boss.emoji}</span>`) +
  `<div class="bname">${B.boss.name}</div><div class="btitle">${B.boss.title}</div>`;

function stageBoss() {
  if (B.boss.art) stageEmoji.innerHTML = `<img src="${B.boss.art}" style="width:150px;height:150px;object-fit:cover;border-radius:14px;border:2px solid rgba(255,158,158,.7)">`;
  else stageEmoji.textContent = B.boss.emoji;
}

const quizEl = document.getElementById('quiz');
B.questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'q'; card.id = 'q' + q.no;
  let inner = `<span class="tag">その${CIRCLED[q.no-1]}｜${q.subject}${q.type==='fill'?'（選択式）':''}</span>`;
  inner += `<div class="qtext">${q.text}</div>`;
  if (q.hint) {
    inner += `<button class="hintBtn" data-q="${q.no}">💡 ${q.hint_from || 'かつての好敵手'}の助言を聞く</button>` +
             `<div class="hinttext" id="hint${q.no}">${q.hint}</div>`;
  }
  if (q.type === 'single') {
    q.choices.forEach((c, i) => {
      inner += `<button class="choice" data-q="${q.no}" data-i="${i}"><span class="mark">${String.fromCharCode(65+i)}</span><span>${c}</span></button>`;
    });
  } else {
    q.blanks.forEach((b, bi) => {
      inner += `<div class="blank-group"><div class="blabel">【 ${b.label} 】</div><div class="opts">`;
      q.options.forEach((o, oi) => {
        inner += `<button class="opt" data-q="${q.no}" data-b="${bi}" data-i="${oi}">${CIRCLED[oi]}${o}</button>`;
      });
      inner += `</div></div>`;
    });
  }
  if ((B.goldra || 0) > 0) {
    inner += `<button class="goldra" data-gq="${q.no}">🐉 黄金竜ゴルドラを呼ぶ<span class="gleft"></span></button>`;
  }
  inner += `<div class="result-banner" id="banner${q.no}"></div><div class="expl" id="expl${q.no}"></div>`;
  card.innerHTML = inner;
  quizEl.appendChild(card);
  state[q.no] = q.type === 'single' ? null : new Array(q.blanks.length).fill(null);
});

let goldraLeft = B.goldra || 0;
const goldraUsedOn = [];   // ゴルドラに任せた問題番号

function saveLocal() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ state, graded, outcome, chosenJob, goldraLeft, goldraUsedOn })); } catch (e) {}
}

function paintGoldra() {
  document.querySelectorAll('.goldra').forEach(btn => {
    const qno = parseInt(btn.dataset.gq, 10);
    const used = goldraUsedOn.includes(qno);
    btn.disabled = graded || used || goldraLeft <= 0;
    btn.querySelector('.gleft').textContent =
      used ? '（この問題は任せた）' : (goldraLeft > 0 ? `（残り${goldraLeft}体）` : '（もういない）');
    if (used) btn.textContent = '🐉 黄金竜ゴルドラが答えを教えてくれた';
  });
}

/* ゴルドラに1問任せる: 正解を選択済みにして固定する */
function summonGoldra(qno, fromRestore) {
  const q = B.questions.find(x => x.no === qno);
  if (!q) return;
  if (!fromRestore) { goldraLeft--; goldraUsedOn.push(qno); }
  if (q.type === 'single') {
    state[qno] = q.answer;
    document.querySelectorAll(`.choice[data-q="${qno}"]`).forEach(el => {
      el.classList.remove('sel');
      if (parseInt(el.dataset.i, 10) === q.answer) el.classList.add('sel', 'goldra-pick');
    });
  } else {
    state[qno] = q.blanks.map(b2 => b2.answer);
    q.blanks.forEach((b2, bi) => {
      document.querySelectorAll(`.opt[data-q="${qno}"][data-b="${bi}"]`).forEach(el => {
        el.classList.remove('sel');
        if (parseInt(el.dataset.i, 10) === b2.answer) el.classList.add('sel', 'goldra-pick');
      });
    });
  }
  paintGoldra(); updateBtn(); saveLocal();
  if (!fromRestore) {
    const d = document.getElementById('dragon');
    d.classList.remove('fly'); void d.offsetWidth; d.classList.add('fly');
    if (soundOn()) {   // 竜の咆哮＋きらめき
      [65.4, 82.4, 98].forEach((f, i) => tone(f, i * .06, .9, 'sawtooth', .12));
      [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(f, .35 + i * .09, .5, 'triangle', .07));
    }
  }
}

/* 確認ダイアログ */
const confirmEl = document.getElementById('confirm');
let pendingQ = null;
document.addEventListener('click', e => {
  const g = e.target.closest('.goldra');
  if (g && !g.disabled) {
    pendingQ = parseInt(g.dataset.gq, 10);
    document.getElementById('confirmText').innerHTML =
      `🐉 <b>その${CIRCLED[pendingQ-1]}</b> を　黄金竜ゴルドラに任せますか？<br>` +
      `この問題は正解になりますが、ゴルドラは去っていきます。<br>` +
      `<span style="color:#ffd24d">（残り${goldraLeft}体・戻せません）</span>`;
    confirmEl.classList.add('show');
  }
});
document.getElementById('cYes').addEventListener('click', () => {
  confirmEl.classList.remove('show');
  if (pendingQ != null) summonGoldra(pendingQ, false);
  pendingQ = null;
});
document.getElementById('cNo').addEventListener('click', () => {
  confirmEl.classList.remove('show'); pendingQ = null;
});
quizEl.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.classList.contains('hintBtn')) {
    const h = document.getElementById('hint' + btn.dataset.q);
    h.style.display = 'block'; btn.style.display = 'none'; sfxBlip();
    return;
  }
  if (graded) return;
  const qno = parseInt(btn.dataset.q);
  if (btn.classList.contains('choice')) {
    document.querySelectorAll(`.choice[data-q="${qno}"]`).forEach(el => el.classList.remove('sel'));
    btn.classList.add('sel'); state[qno] = parseInt(btn.dataset.i);
  } else if (btn.classList.contains('opt')) {
    const bi = parseInt(btn.dataset.b);
    document.querySelectorAll(`.opt[data-q="${qno}"][data-b="${bi}"]`).forEach(el => el.classList.remove('sel'));
    btn.classList.add('sel'); state[qno][bi] = parseInt(btn.dataset.i);
  }
  saveLocal(); updateBtn();
});
function allAnswered() {
  return B.questions.every(q => q.type === 'single' ? state[q.no] !== null : state[q.no].every(v => v !== null));
}
function updateBtn() {
  const b = document.getElementById('fightBtn');
  b.disabled = !allAnswered();
  b.textContent = allAnswered() ? '⚔️ たたかう' : 'たたかう（未回答あり）';
}

// ---- 採点と勝敗 ----
function grade(fromRestore) {
  graded = true;
  const results = [];
  B.questions.forEach(q => {
    let ok;
    if (q.type === 'single') {
      ok = state[q.no] === q.answer;
      document.querySelectorAll(`.choice[data-q="${q.no}"]`).forEach(el => {
        const i = parseInt(el.dataset.i);
        if (i === q.answer) el.classList.add('correct');
        else if (i === state[q.no]) el.classList.add('wrong');
      });
    } else {
      ok = q.blanks.every((b2, bi) => state[q.no][bi] === b2.answer);
      q.blanks.forEach((b2, bi) => {
        document.querySelectorAll(`.opt[data-q="${q.no}"][data-b="${bi}"]`).forEach(el => {
          const i = parseInt(el.dataset.i);
          if (i === b2.answer) el.classList.add('correct');
          else if (i === state[q.no][bi]) el.classList.add('wrong');
        });
      });
    }
    results.push(ok);
    const banner = document.getElementById('banner' + q.no);
    banner.textContent = ok ? '⚔️ 会心の一撃！' : `💥 ${B.boss.name}の反撃を受けた…`;
    banner.className = 'result-banner ' + (ok ? 'ok' : 'ng');
    const ex = document.getElementById('expl' + q.no);
    ex.style.display = 'block';
    ex.innerHTML = `<div style="white-space:pre-wrap">${q.explanation}</div>` +
      (q.ref ? `<div class="ref">根拠：<a href="${q.ref.url}" target="_blank" rel="noopener">${q.ref.label}</a></div>` : '');
  });
  const score = results.filter(Boolean).length;
  const wrong = results.map((r, i) => r ? null : i + 1).filter(Boolean);
  const need = B.ex ? 7 : 6;          // EXボスは8問中7問正解で勝利
  outcome = score >= need ? 'win' : 'lose';
  saveLocal();
  if (!fromRestore && SUBMIT_URL && !SUBMIT_URL.startsWith('__')) {
    const key = (B.ex ? 'saiyo-exboss-' : 'saiyo-boss-') + B.date;
    try {
      fetch(SUBMIT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ date: key, score: score, wrong: wrong }) });
      if (goldraUsedOn.length > 0) {   // 使ったゴルドラの数を翌朝の集計に渡す
        fetch(SUBMIT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ date: 'saiyo-goldra-' + B.date, score: goldraUsedOn.length, wrong: [] }) });
      }
    } catch (e) {}
  }
  paintGoldra();
  document.getElementById('fightBtn').style.display = 'none';
  if (window.BGM) BGM.stop();
  if (fromRestore) return;
  if (outcome === 'win') playVictory(score);
  else playDefeat(score);
}
document.getElementById('fightBtn').addEventListener('click', () => {
  if (graded || !allAnswered()) return;
  grade(false);
});

// ---- 勝利シーン ----
function playVictory(score) {
  ovl.classList.add('show');
  stageEmoji.className = ''; stageBoss(); stageName.textContent = B.boss.name;
  const scenes = [
    { text: `${B.boss.name}に　${score}かいの　こうげき！`, before: () => {} },
    { text: `${B.boss.name}「ば、ばかな……　この……！」` },
    { text: `${B.boss.name}を　たおした！`, before: () => { sfxDefeatBoss(); stageEmoji.classList.add('gone'); } }
  ];
  if (B.boss.victory_quote) {
    scenes.push({ text: `${B.boss.name}の声「${B.boss.victory_quote}」`, wait: 400 });
  }
  if (B.ex) {   // ---- EXボス（トリプルフォー）の勝利: 女神ではなく宝を得る ----
    const R = B.ex_rewards || {};
    const exScenes = [
      { text: `……`, wait: 500, before: () => { sfxFanfare(); stageName.textContent = ''; } },
      { text: `くろい　かたちが　ほどけてゆく……`, wait: 700,
        before: () => { stageEmoji.className = ''; stageEmoji.textContent = '✨'; stageName.textContent = ''; } },
      { text: `🛡 「黄金竜の逆鱗」を　手に入れた！`, wait: 300,
        before: () => { stageEmoji.textContent = '🛡'; sfxGoddess(); } }
    ];
    (R.items || []).forEach(it => {
      exScenes.push({ text: `🎁 「${it}」を　手に入れた！`, wait: 200,
                      before: () => { stageEmoji.textContent = '🎁'; sfxBlip(); } });
    });
    if (R.goldra) {
      exScenes.push({ text: `🐉 金色の竜が　封から　解き放たれた……！`, wait: 600,
                      before: () => { stageEmoji.textContent = '🐉'; sfxFanfare(); } });
      exScenes.push({ text: `黄金竜「ゴルドラ」が　仲間になった！　ボス戦で　1問　任せられる。` });
    } else {
      exScenes.push({ text: `（竜の姿は　なかった。次に倒したとき　ふたたび出会えるだろう）` });
    }
    exScenes.push({ text: `地図の欠片は　風に還った。　また7枚　集めれば　トリプルフォーは　よみがえる。` });
    exScenes.push({ text: `🏆 トリプルフォー　討伐 ${R.defeats || 1}回目　――　旅は　まだ続く。`,
                    before: () => { stageEmoji.textContent = '🏆'; } });
    playScenes(scenes.concat(exScenes), () => {
      msgtext.innerHTML = '<a href="./" style="color:#ffe9a8">◀ メニューへもどる</a>';
      arrowEl.style.display = 'none';
    });
    return;
  }
  playScenes(scenes.concat([
    { text: `……`, wait: 500, before: () => { sfxFanfare(); stageName.textContent = ''; } },
    { text: `まばゆい光とともに　女神が　あらわれた……！`, wait: 900,
      before: () => { stageEmoji.className = 'goddess'; stageEmoji.textContent = '👼'; stageName.textContent = '女神'; sfxGoddess(); } },
    { text: `女神「よくぞ　倒しました」` },
    { text: `女神「その強さ、みごとです」` },
    { text: `女神「あなたに　職業選択の自由を　与えましょう」` },
    { text: `女神「どれか一つ　選んでください」` }
  ]), showJobSelect);
}

// ---- 職業選択 ----
function showJobSelect() {
  const win = document.getElementById('jobwin');
  win.style.display = 'block';
  win.innerHTML = `<div class="jtitle">— 職業をえらぶ —</div>` +
    B.jobs.map((j, i) =>
      `<div class="job" data-i="${i}">${j.art ? `<img src="${j.art}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;float:right;margin-left:8px;image-rendering:pixelated">` : ''}<div class="jname">${j.emoji} ${j.name}${j.key === B.current_job ? ' <span class="now">（いまの職業）</span>' : ''}</div>` +
      `<div class="jspec">とくい：${j.specialty}</div><div class="jdesc">${j.desc}</div><div style="clear:both"></div></div>`).join('') +
    `<div id="jobConfirm"><button id="jobYes">この職業にする</button><button id="jobNo">考え直す</button></div>`;
  msgtext.textContent = '';
  arrowEl.style.display = 'none';
  let selIdx = null;
  win.addEventListener('click', e => {
    const jd = e.target.closest('.job');
    if (jd) {
      win.querySelectorAll('.job').forEach(el => el.classList.remove('sel'));
      jd.classList.add('sel');
      selIdx = parseInt(jd.dataset.i);
      sfxBlip();
      document.getElementById('jobConfirm').style.display = 'block';
      typeLine(`女神「${B.jobs[selIdx].name}……　それで　いいのですね？」`, () => {});
      return;
    }
    if (e.target.id === 'jobYes' && selIdx !== null) confirmJob(selIdx);
    if (e.target.id === 'jobNo') {
      win.querySelectorAll('.job').forEach(el => el.classList.remove('sel'));
      document.getElementById('jobConfirm').style.display = 'none';
      selIdx = null;
      typeLine('女神「どれか一つ　選んでください」', () => {});
    }
  });
}
function confirmJob(idx) {
  chosenJob = B.jobs[idx].key;
  saveLocal();
  if (SUBMIT_URL && !SUBMIT_URL.startsWith('__')) {
    try {
      fetch(SUBMIT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ date: 'saiyo-job-' + B.date, score: idx, wrong: [] }) });
    } catch (e) {}
  }
  document.getElementById('jobwin').style.display = 'none';
  sfxGoddess();
  playScenes([
    { text: `女神「${B.jobs[idx].name}の力を　さずけました」`, emoji: '✨', name: '' },
    { text: `女神「あしたの朝から　あたらしい旅が　始まります」` },
    { text: `女神「では……　健闘を　祈ります」` },
    { text: `${B.jobs[idx].emoji} あなたは　${B.jobs[idx].name}に　転職した！\nあしたの朝9:05、${B.jobs[idx].name}としての　最初の依頼が届く。`, before: () => { stageEmoji.textContent = B.jobs[idx].emoji; stageEmoji.className = ''; } }
  ], () => { arrowEl.style.display = 'none'; });
}

// ---- 敗北シーン ----
function playDefeat(score) {
  ovl.classList.add('show');
  stageEmoji.className = ''; stageBoss(); stageName.textContent = B.boss.name;
  sfxLose();
  const dlines = (B.boss.defeat_lines && B.boss.defeat_lines.length)
    ? B.boss.defeat_lines.map(t => ({ text: `${B.boss.name}「${t}」` }))
    : [ { text: `${B.boss.name}「フン……　その程度か」` }, { text: `${B.boss.name}「お前は　俺に　勝てない」` } ];
  playScenes([
    { text: `こうげきは　${score}かいしか　当たらなかった……` },
    ...dlines,
    { text: `${B.boss.name}は　闇の中へ　消えていった……`, before: () => { stageEmoji.classList.add('gone'); stageName.textContent = ''; } },
    { text: `「……必ず明日、リベンジする」`, wait: 700 },
    { text: `あしたの朝9:05　${B.boss.name}は　ふたたび　あらわれる。\n弱点を　見直しておこう。（下の解説を読める）` }
  ], () => {
    arrowEl.style.display = 'none';
    setTimeout(() => { ovl.classList.remove('show'); }, 1200);
    ovl.addEventListener('click', () => ovl.classList.remove('show'), { once: true });
  });
}

// ---- 復元 ----
paintGoldra();

(function restore() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { updateBtn(); return; }
    const d = JSON.parse(raw);
    if (d && Array.isArray(d.goldraUsedOn) && d.goldraUsedOn.length) {
      d.goldraUsedOn.forEach(qno => { goldraUsedOn.push(qno); summonGoldra(qno, true); });
      if (typeof d.goldraLeft === 'number') goldraLeft = d.goldraLeft;
      paintGoldra();
    }
    if (d && d.state) {
      Object.keys(d.state).forEach(k => { state[k] = d.state[k]; });
      B.questions.forEach(q => {
        if (q.type === 'single') {
          if (state[q.no] !== null) {
            const el = document.querySelector(`.choice[data-q="${q.no}"][data-i="${state[q.no]}"]`);
            if (el) el.classList.add('sel');
          }
        } else {
          state[q.no].forEach((v, bi) => {
            if (v !== null) {
              const el = document.querySelector(`.opt[data-q="${q.no}"][data-b="${bi}"][data-i="${v}"]`);
              if (el) el.classList.add('sel');
            }
          });
        }
      });
      if (d.graded) {
        grade(true);
        outcome = d.outcome; chosenJob = d.chosenJob || null;
        if (outcome === 'win' && !chosenJob) {
          ovl.classList.add('show');
          stageEmoji.className = 'goddess'; stageEmoji.textContent = '👼'; stageName.textContent = '女神';
          typeLine('女神「おかえりなさい。　どれか一つ　選んでください」', showJobSelect);
        } else if (outcome === 'win' && chosenJob) {
          const j = B.jobs.find(x => x.key === chosenJob) || B.jobs[0];
          ovl.classList.add('show');
          stageEmoji.className = ''; stageEmoji.textContent = j.emoji; stageName.textContent = '';
          typeLine(`${j.emoji} あなたは　${j.name}に　転職ずみ。\nあしたの朝9:05、あたらしい旅が始まる。`, () => {
            ovl.addEventListener('click', () => ovl.classList.remove('show'), { once: true });
          });
        }
      }
    }
  } catch (e) {}
  updateBtn();
})();

// ---- 登場デモ(未採点時のみ) ----
if (!graded) {
  ovl.classList.add('show');
  stageBoss(); stageName.textContent = '';
  sfxAppear();
  const introScenes = B.boss.intro.map((t, i) => ({ text: t, name: i === 0 ? '' : B.boss.name }));
  playScenes(introScenes, () => {
    ovl.classList.remove('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}
