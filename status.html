<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ステータス｜採用クエスト</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0c0c50">
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body {
    margin: 0; min-height: 100vh; background: #060630; color: #fff;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", -apple-system, sans-serif;
    padding: 62px 12px 40px; display: flex; flex-direction: column; align-items: center; gap: 12px;
    line-height: 1.7;
  }
  .ffwin {
    width: 100%; max-width: 460px;
    background: linear-gradient(180deg, #2038c8 0%, #0c1878 100%);
    border: 3px solid #fff; border-radius: 8px;
    box-shadow: 0 0 0 3px #3858e8, 0 6px 24px rgba(0,0,0,.6);
    padding: 12px 16px; font-size: 14px;
  }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .head .t { font-size: 16px; font-weight: 700; letter-spacing: 3px; text-shadow: 2px 2px 0 #000; }
  .head a { color: #9fd0ff; text-decoration: none; font-size: 13px; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .row .k { color: #cdd6ff; }
  .row .v { font-weight: 700; text-align: right; }
  .sect { color: #ffd24d; font-size: 12.5px; letter-spacing: 2px; margin-bottom: 4px; text-shadow: 1px 1px 0 #000; }
  .xpbar { background: #0a1050; border: 1px solid #5868d8; border-radius: 4px; height: 10px; margin: 6px 0 2px; overflow: hidden; }
  .xpbar .fill { background: linear-gradient(90deg, #58c8ff, #a0e8ff); height: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { color: #cdd6ff; font-weight: 400; text-align: right; font-size: 11.5px; padding: 1px 4px; }
  th:first-child { text-align: left; }
  td { padding: 2px 4px; text-align: right; }
  td.subj { text-align: left; font-weight: 700; }
  td.subj .star { color: #ffd24d; }
  .dots { color: #5868d8; }
  .list { font-size: 13px; }
  .muted { color: #8890d8; font-size: 12.5px; }
  .rival { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
  .rival img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(255,255,255,.45); flex-shrink: 0; }
  .rival .rmid { flex: 1; min-width: 0; }
  .rival .rn { font-weight: 700; }
  .rival.destiny .rn { color: #ff9e9e; }
  .rival .rl { color: #cdd6ff; flex-shrink: 0; }
  .rivalnote { margin-top: 6px; font-size: 12.5px; color: #ffd24d; border-top: 1px dashed #5868d8; padding-top: 6px; }
</style>
</head>
<body>
<div class="ffwin head">
  <span class="t">ステータス</span>
  <a href="./">◀ メニューへもどる</a>
</div>

<div class="ffwin" id="hero" style="display:flex;gap:14px;align-items:stretch">
  <div id="heroLeft" style="flex-shrink:0;width:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(5,10,60,.45);border:1px solid #5868d8;border-radius:8px;padding:10px 4px">
    <img id="jobart" alt="" style="width:120px;image-rendering:pixelated">
    <div id="jobname" style="font-size:12px;font-weight:700;color:#ffd24d;letter-spacing:1px;text-shadow:1px 1px 0 #000;text-align:center"></div>
  </div>
  <div id="basic" style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center"></div>
</div>
<div class="ffwin"><div class="sect">ステータス（かず＝るいけい正解　りつ＝正答率）</div><table id="stats"></table></div>
<div class="ffwin"><div class="sect">🛡 そうび</div><div class="list" id="items"></div></div>
<div class="ffwin"><div class="sect">🏅 バッジ</div><div class="list" id="badges"></div></div>
<div class="ffwin"><div class="sect">📜 しょくれき</div><div class="list" id="history"></div></div>
<div class="ffwin"><div class="sect">🏆 じこベスト</div><div class="list" id="best"></div></div>
<div class="ffwin"><div class="sect">⚔️ ライバルたち</div><div id="rivals"></div></div>

<script>
const S = {"date": "2026-08-16", "player": {"name": "きょうへい", "job": "サイヨウ勇者", "job_emoji": "🗡", "level": 1, "lap": 1, "xp_total_job": 40, "xp_in_level": 40, "next_need": 10, "streak": 1, "art": "art/sprite_yusha.png", "title": null}, "stats": [{"subject": "戦略", "star": false, "count": 1, "rate": "100%"}, {"subject": "マーケ", "star": false, "count": 1, "rate": "100%"}, {"subject": "媒体", "star": false, "count": 1, "rate": "100%"}, {"subject": "運用", "star": false, "count": 1, "rate": "100%"}, {"subject": "スカウト", "star": false, "count": 0, "rate": "—"}, {"subject": "チャネル", "star": false, "count": 0, "rate": "—"}, {"subject": "計算", "star": false, "count": 0, "rate": "—"}, {"subject": "時事", "star": false, "count": 0, "rate": "0%"}], "items": [], "badges": [], "history": [], "best": {"fastest_lap_days": null, "best_week_rate": null, "longest_streak": 1}, "rivals": [{"emoji": "📋", "name": "軍師ダンドリ", "level": 1, "lap": 1, "destiny": false, "art": "art/job_knight.jpg"}, {"emoji": "🎻", "name": "詩人カタリベ", "level": 1, "lap": 1, "destiny": false, "art": "art/job_bard.jpg"}, {"emoji": "💰", "name": "大商人バイタン", "level": 1, "lap": 1, "destiny": false, "art": "art/job_summoner.jpg"}, {"emoji": "🌀", "name": "修行僧グルグル", "level": 1, "lap": 1, "destiny": false, "art": "art/job_monk.jpg"}, {"emoji": "🥷", "name": "影のヒッコヌキ", "level": 1, "lap": 1, "destiny": false, "art": "art/job_ninja.jpg"}, {"emoji": "⚓", "name": "船長ツテヅル", "level": 1, "lap": 1, "destiny": false, "art": "art/job_sailor.jpg"}, {"emoji": "🧮", "name": "老師ソロバン", "level": 1, "lap": 1, "destiny": false, "art": "art/job_sanjutsu.jpg"}], "rival_line": "7人のライバル商人たちも、旅を始めている。"};
const p = S.player;
if (p.art) { document.getElementById('jobart').src = p.art; }
else { document.getElementById('heroLeft').style.display = 'none'; }
document.getElementById('jobname').textContent = p.job;
if (p.title) {
  const t = document.createElement('div');
  t.style.cssText = 'font-size:11px;color:#ffd24d;letter-spacing:1px;text-shadow:1px 1px 0 #000;margin-top:2px';
  t.textContent = '《' + p.title + '》';
  document.getElementById('jobname').after(t);
}
document.getElementById('basic').innerHTML =
  `<div class="row"><span style="font-size:16px;font-weight:800">${p.name}</span><span class="v" style="font-size:12px;color:#cdd6ff">${S.date}</span></div>` +
  `<div class="row"><span class="k">レベル</span><span class="v">${p.level}</span></div>` +
  `<div class="row"><span class="k">しゅうかい</span><span class="v">${p.lap}周目</span></div>` +
  `<div class="row"><span class="k">けいけんち</span><span class="v">${p.xp_total_job}</span></div>` +
  `<div class="row"><span class="k">つぎのレベルまで</span><span class="v">あと ${p.next_need}</span></div>` +
  `<div class="xpbar"><div class="fill" style="width:${Math.min(100, Math.round(p.xp_in_level / 50 * 100))}%"></div></div>` +
  `<div class="row"><span class="k">れんぞく</span><span class="v">🔥 ${p.streak}日</span></div>`;

document.getElementById('stats').innerHTML =
  `<tr><th>しょうろ</th><th>かず</th><th>りつ</th></tr>` +
  S.stats.map(s =>
    `<tr><td class="subj">${s.star ? '<span class="star">★</span>' : ''}${s.subject}</td>` +
    `<td>${s.count}</td><td>${s.rate}</td></tr>`).join('');

function fillList(id, arr, empty) {
  document.getElementById(id).innerHTML = arr && arr.length
    ? arr.map(x => `・${x}`).join('<br>') : `<span class="muted">${empty}</span>`;
}
fillList('items', S.items, 'まだ　なにも持っていない（全問正解の日に装備品を1つ入手）');
fillList('badges', S.badges, 'ボスを倒すと　女神の祝福バッジが授けられる');
fillList('history', S.history, 'サイヨウ勇者として　旅は始まったばかり');

const b = S.best;
document.getElementById('best').innerHTML =
  `・さいそく周回　${b.fastest_lap_days ? b.fastest_lap_days + '日' : '——'}<br>` +
  `・しゅうかん正答率ベスト　${b.best_week_rate || '——'}<br>` +
  `・さいちょう連続記録　${b.longest_streak || 0}日`;

document.getElementById('rivals').innerHTML =
  S.rivals.map(r =>
    `<div class="rival${r.destiny ? ' destiny' : ''}">` +
    (r.art ? `<img src="${r.art}" alt="">` : '') +
    `<span class="rmid"><span class="rn">${r.emoji} ${r.name}${r.destiny ? '（宿命）' : ''}</span></span>` +
    `<span class="rl">Lv.${r.level}・${r.lap}周目</span></div>`).join('') +
  (S.rival_line ? `<div class="rivalnote">${S.rival_line}</div>` : '');
</script>
<script src="bgm.js?v=11"></script>
<script>BGM.mount('status', 'right');</script>
</body>
</html>
