<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Triple FANTASY Ⅲ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#061238">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden;
    background:
      radial-gradient(ellipse 120% 50% at 50% -12%, #16335f 0%, rgba(22,51,95,0) 60%),
      radial-gradient(ellipse 80% 50% at 50% 118%, #071c40 0%, rgba(7,28,64,0) 60%),
      linear-gradient(180deg, #03081c 0%, #071433 48%, #050d26 100%);
    color: #eaf0ff;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; position: relative;
  }
  /* 光芒 */
  .beam {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 52vmin; height: 100%;
    background: linear-gradient(180deg, rgba(150,200,255,.12) 0%, rgba(150,200,255,.04) 45%, rgba(150,200,255,0) 72%);
    clip-path: polygon(36% 0, 64% 0, 88% 100%, 12% 100%);
    filter: blur(6px);
    pointer-events: none;
  }
  /* 星空 */
  #stars { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .star { position: absolute; border-radius: 50%; background: #dce8ff;
    animation: twinkle var(--tw, 4s) ease-in-out var(--td, 0s) infinite; }
  @keyframes twinkle { 0%, 100% { opacity: var(--o1, .8); } 50% { opacity: var(--o2, .15); } }
  /* オーロラ(漂う光霧) */
  .aurora { position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none; mix-blend-mode: screen; }
  .aurora.a1 { width: 70vmin; height: 34vmin; left: -8vmin; top: 16%;
    background: radial-gradient(closest-side, rgba(62,200,232,.16), transparent 70%);
    animation: drift1 52s ease-in-out infinite alternate; }
  .aurora.a2 { width: 62vmin; height: 30vmin; right: -6vmin; top: 42%;
    background: radial-gradient(closest-side, rgba(120,110,240,.14), transparent 70%);
    animation: drift2 64s ease-in-out infinite alternate; }
  .aurora.a3 { width: 50vmin; height: 26vmin; left: 28%; bottom: 4%;
    background: radial-gradient(closest-side, rgba(78,232,168,.10), transparent 70%);
    animation: drift1 74s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(9vmin, -5vmin) scale(1.18); } }
  @keyframes drift2 { from { transform: translate(0, 0) scale(1.1); } to { transform: translate(-10vmin, 4vmin) scale(.95); } }
  /* 立ち昇る光の粒 */
  .mote { position: absolute; bottom: -2vh; border-radius: 50%; background: #cfe4ff;
    box-shadow: 0 0 6px 2px rgba(160,200,255,.55); pointer-events: none; opacity: 0;
    animation: rise var(--rd, 18s) linear var(--rdel, 0s) infinite; }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    12% { opacity: var(--mo, .5); }
    75% { opacity: var(--mo, .5); }
    100% { transform: translateY(-105vh); opacity: 0; }
  }
  /* HUMAN DATA サークル(SVG) */
  #ring {
    position: absolute; left: 50%; top: 46%;
    width: 92vmin; height: 92vmin; max-width: 640px; max-height: 640px;
    transform: translate(-50%, -54%);
    opacity: .10; pointer-events: none;
    animation: ringspin 120s linear infinite;
  }
  @keyframes ringspin { from { transform: translate(-50%, -54%) rotate(0deg); } to { transform: translate(-50%, -54%) rotate(360deg); } }
  #ringLabels {
    position: absolute; left: 50%; top: 46%;
    width: 92vmin; height: 92vmin; max-width: 640px; max-height: 640px;
    transform: translate(-50%, -54%);
    opacity: .15; pointer-events: none;
  }
  /* タイトル */
  .titlebox { position: relative; text-align: center; z-index: 2; margin-top: -4vh; }
  .humandata {
    font-family: "Avenir Next", "Futura", "Helvetica Neue", sans-serif;
    font-size: 13px; letter-spacing: 10px; color: #9db8e8; opacity: .55;
    text-transform: uppercase; margin-bottom: 10px;
  }
  h1 {
    margin: 0; font-weight: 700; font-style: italic;
    font-family: "Times New Roman", "Hiragino Mincho ProN", serif;
    font-size: clamp(34px, 9vw, 64px); line-height: 1.15; letter-spacing: 2px;
    background: linear-gradient(180deg, #ffffff 18%, #cfe0ff 42%, #7f96c4 58%, #e8f0ff 78%, #93a8d4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 10px rgba(120,170,255,.35)) drop-shadow(0 1px 0 rgba(0,0,0,.7));
    white-space: nowrap;
  }
  h1 .three { font-size: 1.15em; padding-left: 6px; }
  .underline {
    width: min(74vw, 460px); height: 2px; margin: 12px auto 0;
    background: linear-gradient(90deg, transparent, #cfe0ff, transparent);
    opacity: .7;
  }
  /* プレイヤー情報 */
  .pinfo {
    z-index: 2; margin-top: 26px; font-size: 13.5px; color: #b9c9ec; letter-spacing: 2px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  .pinfo b { color: #eef4ff; font-size: 15px; }
  /* メニュー(FF15風テキストリスト) */
  .cmd { z-index: 2; margin-top: 5vh; display: flex; flex-direction: column; gap: 6px; min-width: 250px; }
  .cmd a {
    display: flex; align-items: center; gap: 12px;
    color: #dfe8ff; text-decoration: none;
    font-size: 19px; letter-spacing: 6px; padding: 11px 18px;
    text-shadow: 0 1px 6px rgba(0,0,0,.9);
    border-left: 2px solid transparent; transition: all .15s;
  }
  .cmd a .cursor { width: 1em; opacity: 0; flex-shrink: 0; color: #fff; filter: drop-shadow(0 0 6px #9db8e8); }
  .cmd a:hover, .cmd a:active {
    color: #ffffff; border-left-color: #cfe0ff;
    background: linear-gradient(90deg, rgba(160,190,255,.14), transparent);
  }
  .cmd a:hover .cursor, .cmd a:active .cursor { opacity: 1; }
  .cmd a.boss { color: #ffd24d; animation: blink 1.3s step-end infinite; }
  @keyframes blink { 50% { opacity: .5; } }
  .cmd .locked { color: #6d7cb0; font-size: 12px; letter-spacing: 2px; padding: 2px 18px 0; }
  .foot {
    position: absolute; bottom: 18px; left: 0; right: 0; text-align: center;
    font-size: 11px; letter-spacing: 3px; color: #5d6c9e; z-index: 2;
  }
</style>
</head>
<body>
<div id="stars"></div>
<div class="aurora a1"></div>
<div class="aurora a2"></div>
<div class="aurora a3"></div>
<div class="beam"></div>

<svg id="ring" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ec8e8"/><stop offset="1" stop-color="#4ee8a8"/>
    </linearGradient>
  </defs>
  <!-- 4分割リング(採用→教育→定着→ブランド) -->
  <g fill="none" stroke="url(#tg1)" stroke-width="34" stroke-linecap="round">
    <path d="M 200 48 A 152 152 0 0 1 341 148"/>
    <path d="M 349 210 A 152 152 0 0 1 252 344"/>
    <path d="M 190 351 A 152 152 0 0 1 59 252"/>
    <path d="M 51 190 A 152 152 0 0 1 148 56"/>
  </g>
</svg>
<svg id="ringLabels" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <g font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="19" font-weight="700" fill="#bfe8ff" text-anchor="middle">
    <text x="285" y="80">採用</text>
    <text x="336" y="290">教育</text>
    <text x="115" y="330">定着</text>
    <text x="62" y="112">ブランド</text>
  </g>
  <g font-family="'Avenir Next', 'Futura', sans-serif" text-anchor="middle" fill="#cfe4ff">
    <text x="200" y="192" font-size="30" font-weight="800" letter-spacing="4">HUMAN</text>
    <text x="200" y="226" font-size="30" font-weight="800" letter-spacing="4">DATA</text>
  </g>
</svg>

<div class="titlebox">
  <div class="humandata">Human Data Saga</div>
  <h1>Triple FANTASY<span class="three">Ⅲ</span></h1>
  <div class="underline"></div>
</div>

<div class="pinfo" id="pinfo"></div>
<div class="cmd" id="cmd"></div>
<div class="foot" id="dateLine"></div>

<script>
const MENU = {"date": "2026-08-17", "weekday": "月", "mode": "quest", "player": {"name": "きょうへい", "job": "サイヨウ勇者", "job_emoji": "🗡", "level": 1, "lap": 1}};
document.getElementById('dateLine').textContent =
  `${MENU.date}（${MENU.weekday}）　毎朝9:05　あたらしい依頼が届く`;
document.getElementById('pinfo').innerHTML =
  `<b>${MENU.player.name}</b>　${MENU.player.job_emoji} ${MENU.player.job}　Lv.${MENU.player.level}　${MENU.player.lap}周目`;

// 星空と光の粒を生成
(function sky() {
  const stars = document.getElementById('stars');
  let html = '';
  for (let i = 0; i < 110; i++) {
    const sz = Math.random() < .82 ? (Math.random() * 1.4 + .6) : (Math.random() * 2 + 1.8);
    const o1 = (Math.random() * .5 + .4).toFixed(2);
    const o2 = (Math.random() * .2 + .05).toFixed(2);
    html += `<span class="star" style="left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*100).toFixed(2)}%;width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px;--tw:${(Math.random()*5+2.5).toFixed(1)}s;--td:${(Math.random()*6).toFixed(1)}s;--o1:${o1};--o2:${o2}"></span>`;
  }
  for (let i = 0; i < 14; i++) {
    const sz = (Math.random() * 2.2 + 1.4).toFixed(1);
    html += `<span class="mote" style="left:${(Math.random()*96+2).toFixed(2)}%;width:${sz}px;height:${sz}px;--rd:${(Math.random()*14+13).toFixed(1)}s;--rdel:${(Math.random()*18).toFixed(1)}s;--mo:${(Math.random()*.35+.25).toFixed(2)}"></span>`;
  }
  stars.innerHTML = html;
})();

const cmd = document.getElementById('cmd');
let html = '';
if (MENU.mode === 'boss') {
  html += `<a class="boss" href="boss.html"><span class="cursor">▶</span>⚠️ ボスが　あらわれた！</a>`;
  html += `<div class="locked">ボスを倒すまで　通常の冒険には出られない</div>`;
} else if (MENU.mode === 'job_select') {
  html += `<a class="boss" href="boss.html"><span class="cursor">▶</span>🌟 女神が　待っている</a>`;
} else {
  html += `<a href="quest.html"><span class="cursor">▶</span>冒険に出る</a>`;
}
html += `<a href="status.html"><span class="cursor">▶</span>ステータス</a>`;
html += `<a href="sound.html" style="font-size:15px;letter-spacing:4px;color:#9db8e8"><span class="cursor">▶</span>おんがくの間</a>`;
cmd.innerHTML = html;

// 「冒険に出る」で足音を鳴らしてから出発
cmd.addEventListener('click', e => {
  const a = e.target.closest('a[href="quest.html"]');
  if (!a || !window.BGM || !BGM.footsteps) return;
  e.preventDefault();
  BGM.footsteps(() => { location.href = 'quest.html'; });
});
</script>
<script src="bgm.js?v=7"></script>
<script>BGM.mount('prelude', 'right');</script>
</body>
</html>
