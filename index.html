<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>採用クエスト</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0c0c50">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #060630;
    color: #fff;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px 14px; gap: 14px;
  }
  .ffwin {
    width: 100%; max-width: 420px;
    background: linear-gradient(180deg, #2038c8 0%, #0c1878 100%);
    border: 3px solid #fff; border-radius: 8px;
    box-shadow: 0 0 0 3px #3858e8, 0 6px 24px rgba(0,0,0,.6);
    padding: 14px 18px;
  }
  .title { text-align: center; }
  .title h1 { margin: 0; font-size: 22px; letter-spacing: 4px; text-shadow: 2px 2px 0 #000; }
  .title .date { font-size: 12px; color: #cdd6ff; margin-top: 4px; }
  .pinfo { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .pinfo .name { font-weight: 700; }
  .pinfo .sub { color: #cdd6ff; font-size: 12.5px; }
  .cmd { padding: 8px 10px; }
  .cmd a {
    display: flex; align-items: center; gap: 10px;
    color: #fff; text-decoration: none; font-size: 17px; font-weight: 700;
    padding: 13px 10px; border-radius: 6px; letter-spacing: 1px;
    text-shadow: 1px 1px 0 #000;
  }
  .cmd a .cursor { width: 1em; flex-shrink: 0; opacity: 0; }
  .cmd a:hover .cursor, .cmd a:active .cursor { opacity: 1; }
  .cmd a:hover, .cmd a:active { background: rgba(255,255,255,.12); }
  .cmd a.boss { color: #ffd24d; animation: blink 1.2s step-end infinite; }
  @keyframes blink { 50% { opacity: .55; } }
  .cmd .locked { color: #7d86c8; font-size: 13px; padding: 8px 10px 2px; }
  .foot { font-size: 11px; color: #8890d8; text-align: center; }
</style>
</head>
<body>
<div class="ffwin title">
  <h1>採用クエスト</h1>
  <div class="date" id="dateLine"></div>
</div>
<div class="ffwin pinfo">
  <span class="name" id="pname"></span>
  <span class="sub" id="pjob"></span>
</div>
<div class="ffwin cmd" id="cmd"></div>
<div class="foot">毎朝9:05　あたらしい依頼が届く</div>
<script>
const MENU = {"date": "2026-08-16", "weekday": "日", "mode": "quest", "player": {"name": "きょうへい", "job": "サイヨウ勇者", "job_emoji": "🗡", "level": 1, "lap": 1}};
document.getElementById('dateLine').textContent = `${MENU.date}（${MENU.weekday}）`;
document.getElementById('pname').textContent = MENU.player.name;
document.getElementById('pjob').textContent =
  `${MENU.player.job_emoji} ${MENU.player.job}　Lv.${MENU.player.level}　${MENU.player.lap}周目`;

const cmd = document.getElementById('cmd');
let html = '';
if (MENU.mode === 'boss') {
  html += `<a class="boss" href="boss.html"><span class="cursor">▶</span>⚠️ ボスが　あらわれた！</a>`;
  html += `<div class="locked">（ボスを倒すまで　通常の冒険には出られない）</div>`;
} else if (MENU.mode === 'job_select') {
  html += `<a class="boss" href="boss.html"><span class="cursor">▶</span>🌟 女神が　待っている（職業選択）</a>`;
} else {
  html += `<a href="quest.html"><span class="cursor">▶</span>⚔️ 冒険に出る</a>`;
}
html += `<a href="status.html"><span class="cursor">▶</span>📊 ステータス</a>`;
cmd.innerHTML = html;
</script>
</body>
</html>
